# Local full-stack environment.
#
#   cp .env.example .env      # then set JWT_SECRET
#   docker compose up --build
#
# First run only, to create the schema and load demo data:
#   docker compose --profile setup run --rm migrate
#
# App:     http://localhost:3000
# Health:  http://localhost:3000/api/health
# Login:   demo@gst.com / demo1234
#
# ---------------------------------------------------------------------------
# IMPORTANT: the default service below uses SQLite, because that is what
# `prisma/schema.prisma` currently declares (`provider = "sqlite"`).
#
# A PostgreSQL service is included under the `postgres` profile, but it will
# NOT work until the schema provider is switched. PostgreSQL is the recommended
# production database - see docs/DEPLOYMENT.md for the migration steps.
# ---------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # SQLite file lives on the `appdata` volume so it survives rebuilds.
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/prod.db}
      # Compose fails loudly if this is unset, which is what we want for a secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env and set it}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_ENABLED: ${AI_ENABLED:-false}
    ports:
      - "3000:3000"
    volumes:
      - appdata:/app/data
      - uploads:/app/uploads

  # ---------------------------------------------------------------------------
  # One-shot schema push + demo seed.
  #
  #   docker compose --profile setup run --rm migrate
  #
  # Uses the `builder` stage rather than the slim runtime image because the seed
  # is TypeScript and needs tsx + esbuild (devDependencies that the runtime
  # image deliberately excludes to stay small).
  # ---------------------------------------------------------------------------
  migrate:
    profiles: ["setup"]
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    environment:
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/prod.db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required - copy .env.example to .env and set it}
    volumes:
      - appdata:/app/data
    command: sh -c "npx prisma db push --skip-generate && npx tsx prisma/seed.ts"

  # ---------------------------------------------------------------------------
  # PostgreSQL - start with:  docker compose --profile postgres up --build
  #
  # Before this works you must:
  #   1. Set `provider = "postgresql"` in prisma/schema.prisma
  #   2. Set DATABASE_URL in .env to the postgresql:// URL shown below
  #   3. Run `npx prisma migrate dev --name init` to create real migrations
  # ---------------------------------------------------------------------------
  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gst
      # Local-only development password. Never reuse this anywhere real.
      POSTGRES_PASSWORD: gst_local_dev_password
      POSTGRES_DB: gstinvoice
    ports:
      # Exposed for local tooling (psql, TablePlus). Do not expose in production.
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gst -d gstinvoice"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  appdata:
  uploads:
  db_data:
